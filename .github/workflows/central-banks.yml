name: Extract central-bank rates

on:
  workflow_dispatch:
  schedule:
    # 04:30 Africa/Dar_es_Salaam (UTC+3, no daylight saving time)
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: banking-central-results
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_extractor.py test_results.py
      - run: python run_extract.py --group central
      - name: Reject changes outside generated results
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^results/' || true)"
          test -z "$unexpected" || { echo "Unexpected modified paths: $unexpected"; exit 1; }
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Update central-bank extraction results"
          git push
